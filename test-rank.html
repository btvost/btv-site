<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BTV | Rank-Up Cinematic Preview</title>
  <style>
    body {
      background: #08070d;
      color: #f1f5f9;
      font-family: monospace;
      margin: 0;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    .test-btn {
      background: #ff0033;
      color: #fff;
      border: none;
      padding: 15px 30px;
      font-size: 1.1rem;
      font-weight: bold;
      border-radius: 8px;
      cursor: pointer;
      box-shadow: 0 0 20px rgba(255, 0, 51, 0.4);
      transition: 0.2s;
    }
    .test-btn:hover {
      background: #cc0029;
      box-shadow: 0 0 30px rgba(255, 0, 51, 0.7);
    }

    /* شاشة الترفيع السينمائية */
    .rankup-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(4, 3, 7, 0.95);
      display: none;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 99999;
      opacity: 0;
      transition: opacity 0.4s ease;
    }
    .rankup-overlay.active {
      display: flex;
      opacity: 1;
    }

    /* كانفاس رذاذ الغبار */
    #impact-canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: none;
      z-index: 1000000;
    }

    /* صندوق النص (تبدأ الكلمة من البداية وتأخذ وقتها) */
    .rankup-title-box {
      text-align: center;
      margin-bottom: 25px;
      position: relative;
      z-index: 1000001;
      transform: scale(0.2);
      opacity: 0;
    }

    .rankup-title-box.show-text {
      animation: textSequence 4.0s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
    }

    @keyframes textSequence {
      0% { transform: scale(0.2); opacity: 0; }
      15% { transform: scale(1.15); opacity: 1; }
      30% { transform: scale(1); opacity: 1; }
      100% { transform: scale(1); opacity: 1; }
    }

    .rankup-sub {
      font-size: 0.9rem;
      color: #888;
      letter-spacing: 2px;
      text-transform: uppercase;
      margin-bottom: 5px;
    }

    .rankup-main-name {
      font-size: 2.2rem;
      color: #ffd700;
      text-transform: uppercase;
      letter-spacing: 3px;
      font-weight: 900;
      text-shadow: 0 0 25px rgba(255, 215, 0, 0.7);
    }

    /* بطاقة الـ 3D المعدنية (تظهر عند الثانية 3 وتصدم وتكتمل عند الثانية 4) */
    .rank-card-3d {
      width: 360px;
      background: linear-gradient(145deg, #1b1924, #0b0a0f);
      border: 2px solid #ffd700;
      border-radius: 16px;
      padding: 30px;
      text-align: center;
      box-shadow: 0 0 50px rgba(255, 215, 0, 0.3), inset 0 0 20px rgba(255, 0, 51, 0.2);
      transform: scale(0.1) rotateX(25deg);
      opacity: 0;
      position: relative;
      z-index: 1000001;
    }

    .rank-card-3d.impact {
      animation: cardImpact 1.0s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
    }

    @keyframes cardImpact {
      0% { transform: scale(0.1) rotateX(25deg); opacity: 0; }
      75% { transform: scale(1.05) rotateX(-3deg); opacity: 1; }
      100% { transform: scale(1) rotateX(0deg); opacity: 1; }
    }

    .card-sigil {
      width: 80px;
      height: 80px;
      margin: 0 auto 12px auto;
      display: flex;
      align-items: center;
      justify-content: center;
      filter: drop-shadow(0 0 10px #ff0033);
    }
    .card-alias {
      font-size: 1.3rem;
      font-weight: bold;
      color: #fff;
      letter-spacing: 1px;
      margin-bottom: 4px;
    }
    .card-subtitle {
      font-size: 0.7rem;
      color: #777;
      text-transform: uppercase;
      letter-spacing: 2px;
      margin-bottom: 15px;
    }
    .card-rank-name {
      font-size: 1.1rem;
      color: #ffd700;
      font-weight: bold;
      letter-spacing: 2px;
      margin-bottom: 20px;
      text-shadow: 0 0 12px rgba(255, 215, 0, 0.6);
      text-transform: uppercase;
    }
    .card-meta {
      font-size: 0.8rem;
      color: #aaa;
      border-top: 1px solid #201e30;
      padding-top: 15px;
      display: flex;
      justify-content: space-between;
      font-family: monospace;
    }

    .close-preview-btn {
      margin-top: 30px;
      background: transparent;
      border: 1px solid #444;
      color: #888;
      padding: 8px 20px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.8rem;
      transition: 0.2s;
      position: relative;
      z-index: 1000001;
    }
    .close-preview-btn:hover {
      border-color: #ff0033;
      color: #ff0033;
    }
  </style>
</head>
<body>

  <canvas id="impact-canvas"></canvas>

  <div style="text-align: center;">
    <h1 style="color: #ff0033; letter-spacing: 2px; margin-bottom: 10px;">RANK-UP CINEMATIC PREVIEW</h1>
    <p style="color: #888; margin-bottom: 30px;">Click below to preview with your custom sound effect.</p>
    <button class="test-btn" onclick="triggerRankUpPreview()">[ TEST FINAL RANK-UP ]</button>
  </div>

  <!-- شاشة الترفيع السينمائية -->
  <div class="rankup-overlay" id="rankupOverlay">
    
    <div class="rankup-title-box" id="rankTitleBox">
      <div class="rankup-sub">⚡ RANK UP ACHIEVED ⚡</div>
      <div class="rankup-main-name">EYE OF ARTHOS</div>
    </div>
    
    <div class="rank-card-3d" id="rankCard">
      <div class="card-sigil">
        <svg viewBox="0 0 100 100" style="width:100%; height:100%;">
          <g style="transform-origin: 50px 50px; animation: rotate-sigil 8s linear infinite;">
            <circle cx="50" cy="50" r="45" fill="none" stroke="#ffd700" stroke-width="2.5" stroke-dasharray="10 4 2 4"/>
            <polygon points="50,2 62,38 98,50 62,62 50,98 38,62 2,50 38,38" fill="none" stroke="#ffd700" stroke-width="1.5"/>
          </g>
          <circle cx="50" cy="14" fill="#ff0033" stroke="#ffd700" stroke-width="2" style="filter: drop-shadow(0 0 12px #ff0033);"/>
        </svg>
      </div>
      <div class="card-alias">MR.B</div>
      <div class="card-subtitle">BEYOND THE VOID • SOUL SIGNATURE</div>
      <div class="card-rank-name">EYE OF ARTHOS</div>
      <div class="card-meta">
        <span>ID: BTV-000</span>
        <span style="color: #ffd700; font-weight: bold;">150 XP</span>
      </div>
    </div>

    <button class="close-preview-btn" onclick="closePreview()">[ CLOSE PREVIEW ]</button>
  </div>

  <script>
    var impactCanvas = document.getElementById('impact-canvas');
    var iCtx = impactCanvas.getContext('2d');
    var dustParticles = [];
    var isDustActive = false;

    function resizeImpactCanvas() {
      impactCanvas.width = window.innerWidth;
      impactCanvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeImpactCanvas);
    resizeImpactCanvas();

    function triggerEdgeDustExplosion() {
      dustParticles = [];
      var cardEl = document.getElementById('rankCard');
      var rect = cardEl.getBoundingClientRect(); 
      var colors = ['#ffd700', '#ff0033', '#ff4500', '#ffffff', '#ff2a55'];

      var perimeterPoints = [];
      var steps = 15;
      
      for (var i = 0; i <= steps; i++) {
        perimeterPoints.push({x: rect.left + (rect.width / steps) * i, y: rect.top}); 
        perimeterPoints.push({x: rect.left + (rect.width / steps) * i, y: rect.bottom}); 
        perimeterPoints.push({x: rect.left, y: rect.top + (rect.height / steps) * i}); 
        perimeterPoints.push({x: rect.right, y: rect.top + (rect.height / steps) * i}); 
      }

      perimeterPoints.forEach(pt => {
        var angle = Math.atan2(pt.y - (rect.top + rect.height/2), pt.x - (rect.left + rect.width/2)) + (Math.random() - 0.5) * 0.5;
        var speed = Math.random() * 7 + 2;
        dustParticles.push({
          x: pt.x,
          y: pt.y,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed,
          size: Math.random() * 3.5 + 1,
          color: colors[Math.floor(Math.random() * colors.length)],
          alpha: 1,
          decay: Math.random() * 0.012 + 0.006 
        });
      });

      if (!isDustActive) {
        isDustActive = true;
        animateDust();
      }
    }

    function animateDust() {
      iCtx.clearRect(0, 0, impactCanvas.width, impactCanvas.height);
      for (var i = dustParticles.length - 1; i >= 0; i--) {
        var p = dustParticles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.vx *= 0.94; 
        p.vy *= 0.94;
        p.alpha -= p.decay; 

        if (p.alpha <= 0) {
          dustParticles.splice(i, 1);
          continue;
        }

        iCtx.save();
        iCtx.globalAlpha = p.alpha;
        iCtx.fillStyle = p.color;
        iCtx.shadowColor = p.color;
        iCtx.shadowBlur = 8;
        iCtx.beginPath();
        iCtx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
        iCtx.fill();
        iCtx.restore();
      }

      if (dustParticles.length > 0) {
        requestAnimationFrame(animateDust);
      } else {
        isDustActive = false;
        iCtx.clearRect(0, 0, impactCanvas.width, impactCanvas.height);
      }
    }

    function triggerRankUpPreview() {
      var overlay = document.getElementById('rankupOverlay');
      var titleBox = document.getElementById('rankTitleBox');
      var card = document.getElementById('rankCard');
      
      overlay.classList.add('active');
      titleBox.classList.remove('show-text');
      card.classList.remove('impact');

      // 1. بدء ظهور الكلمة من الثانية 0.0
      setTimeout(function() {
        titleBox.classList.add('show-text');
      }, 100);

      // 2. عند الثانية 3.0 بالضبط: تبدأ البطاقة بالظهور والتحرك نحو الشاشة
      setTimeout(function() {
        card.classList.add('impact');
      }, 3000);

      // 3. عند الثانية 4.0 بالضبط: تصدم البطاقة الشاشة تماماً ويشتغل صوتك الحقيقي وانفجار الرذاذ
      setTimeout(function() {
        try {
          var impactAudio = new Audio('alex_kizenkov-huge-scary-hit-logo-145509.mp3');
          impactAudio.volume = 0.8;
          impactAudio.play();
        } catch(e) { console.error("Audio play error:", e); }

        triggerEdgeDustExplosion(); 
      }, 4000); 
    }

    function closePreview() {
      var overlay = document.getElementById('rankupOverlay');
      overlay.classList.remove('active');
      iCtx.clearRect(0, 0, impactCanvas.width, impactCanvas.height);
    }
  </script>
</body>
</html>
