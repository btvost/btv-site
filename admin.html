<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BTV | Void Control Center (Admin)</title>
  <style>
    body {
      background: #08070d;
      color: #f1f5f9;
      font-family: monospace;
      margin: 0;
      padding: 20px;
    }
    .admin-container {
      max-width: 1050px;
      margin: 0 auto;
      background: #0d0c14;
      border: 1px solid #ff0033;
      border-radius: 12px;
      padding: 25px;
      box-shadow: 0 0 25px rgba(255, 0, 51, 0.2);
    }
    h1 {
      color: #ff0033;
      text-transform: uppercase;
      letter-spacing: 2px;
      margin-top: 0;
      text-align: center;
      text-shadow: 0 0 10px rgba(255, 0, 51, 0.4);
    }
    h2 {
      color: #ff0033;
      font-size: 1.1rem;
      border-bottom: 1px solid #28283d;
      padding-bottom: 8px;
      margin-top: 30px;
      letter-spacing: 1px;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 15px;
    }
    th, td {
      padding: 10px 14px;
      text-align: left;
      border-bottom: 1px solid #1f1d2b;
    }
    th {
      color: #ff0033;
      font-size: 0.85rem;
      letter-spacing: 1px;
      text-transform: uppercase;
    }
    td {
      font-size: 0.82rem;
      color: #cbd5e1;
    }
    tr:hover {
      background: #100f1c;
    }
    .stats-box {
      display: flex;
      justify-content: space-around;
      margin-bottom: 25px;
      padding: 15px;
      background: #14131f;
      border-radius: 8px;
      border: 1px solid #28283d;
    }
    .stat-item {
      text-align: center;
    }
    .stat-num {
      font-size: 1.5rem;
      color: #ff0033;
      font-weight: bold;
    }
    .stat-label {
      font-size: 0.75rem;
      color: #888;
      text-transform: uppercase;
      margin-top: 4px;
    }
    .refresh-btn {
      background: #ff0033;
      color: #fff;
      border: none;
      padding: 10px 20px;
      font-weight: bold;
      border-radius: 6px;
      cursor: pointer;
      display: block;
      margin: 25px auto 0 auto;
      transition: 0.2s;
    }
    .refresh-btn:hover {
      background: #cc0029;
      box-shadow: 0 0 10px rgba(255, 0, 51, 0.5);
    }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

  <div class="admin-container">
    <h1>VOID CONTROL CENTER</h1>
    
    <div class="stats-box">
      <div class="stat-item">
        <div class="stat-num" id="total-users">0</div>
        <div class="stat-label">Total Visitors</div>
      </div>
      <div class="stat-item">
        <div class="stat-num" id="total-comments">0</div>
        <div class="stat-label">Total Comments</div>
      </div>
      <div class="stat-item">
        <div class="stat-num" id="max-xp">0</div>
        <div class="stat-label">Highest XP</div>
      </div>
    </div>

    <h2>Active Visitors & Ranks</h2>
    <table>
      <thead>
        <tr>
          <th>Codename / Alias</th>
          <th>Gender</th>
          <th>Exp ID</th>
          <th>Rank</th>
          <th>XP</th>
          <th>Last Seen</th>
        </tr>
      </thead>
      <tbody id="users-table-body">
        <tr><td colspan="6" style="text-align: center; color: #666;">Loading users...</td></tr>
      </tbody>
    </table>

    <h2>Live Comments & Transmissions</h2>
    <table>
      <thead>
        <tr>
          <th>User</th>
          <th>Rank</th>
          <th>Target Episode / Chapter</th>
          <th>Comment Text</th>
          <th>Time</th>
        </tr>
      </thead>
      <tbody id="comments-table-body">
        <tr><td colspan="5" style="text-align: center; color: #666;">Loading comments...</td></tr>
      </tbody>
    </table>

    <button class="refresh-btn" onclick="initAdmin()">[ REFRESH DATA ]</button>
  </div>

  <script>
    var SUPABASE_URL = "https://jabmdhvyhtgtcypixygg.supabase.co";
    var SUPABASE_KEY = "sb_publishable_oMkm_pQ76xmfel1VQZ-AhA_QfdgmAVX";
    var _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    var titlesMap = {};

    // تحميل data.json لترجمة الأكواد إلى أسماء حقيقية
    async function loadTitlesDictionary() {
      try {
        var res = await fetch('data.json?v=' + Date.now());
        var data = res.ok ? await res.json() : null;
        if (!data) return;

        // ترجمة حلقات الأنيميشن
        if (data.seasons) {
          data.seasons.forEach(s => {
            if (s.episodes) {
              s.episodes.forEach(ep => {
                titlesMap['ep_' + ep.youtube_id] = s.season_title + ' ➔ ' + ep.title;
              });
            }
          });
        }

        // ترجمة فصول الويبتون
        if (data.webtoon_arcs) {
          data.webtoon_arcs.forEach((arc, aIdx) => {
            if (arc.chapters) {
              arc.chapters.forEach((ch, cIdx) => {
                titlesMap['ch_' + aIdx + '_' + cIdx] = arc.arc_title + ' ➔ ' + ch.chapter_num + ': ' + ch.title;
              });
            }
          });
        }
      } catch (e) {
        console.error("Could not load data.json titles", e);
      }
    }

    async function loadAdminData() {
      try {
        await loadTitlesDictionary();

        // 1. جلب المستخدمين
        var { data: users, error: userErr } = await _supabase.from('void_users').select('*').order('xp', { ascending: false });
        if (userErr) throw userErr;

        var usersTbody = document.getElementById('users-table-body');
        if (!users || users.length === 0) {
          usersTbody.innerHTML = '<tr><td colspan="6" style="text-align: center; color: #888;">No visitors recorded yet.</td></tr>';
          document.getElementById('total-users').innerText = '0';
          document.getElementById('max-xp').innerText = '0';
        } else {
          document.getElementById('total-users').innerText = users.length;
          document.getElementById('max-xp').innerText = users[0].xp || 0;
          usersTbody.innerHTML = users.map(u => `
            <tr>
              <td><strong>${u.alias}</strong></td>
              <td>${u.gender || '-'}</td>
              <td style="color: #888;">${u.exp_id || '-'}</td>
              <td style="color: #ff0033; font-weight: bold;">${u.rank_name || 'VOID VESSEL'}</td>
              <td style="color: #ffd700; font-weight: bold;">${u.xp} XP</td>
              <td style="font-size: 0.75rem; color: #666;">${new Date(u.last_seen).toLocaleString()}</td>
            </tr>
          `).join('');
        }

        // 2. جلب التعليقات الحية
        var { data: comments, error: commErr } = await _supabase.from('void_comments').select('*').order('created_at', { ascending: false });
        if (commErr) throw commErr;

        var commentsTbody = document.getElementById('comments-table-body');
        if (!comments || comments.length === 0) {
          commentsTbody.innerHTML = '<tr><td colspan="5" style="text-align: center; color: #888;">No comments recorded yet.</td></tr>';
          document.getElementById('total-comments').innerText = '0';
        } else {
          document.getElementById('total-comments').innerText = comments.length;
          commentsTbody.innerHTML = comments.map(c => {
            var readableTitle = titlesMap[c.item_id] || c.item_id;
            return `
              <tr>
                <td><strong>${c.alias}</strong></td>
                <td style="color: #ff0033;">${c.rank_name || 'VOID VESSEL'}</td>
                <td style="color: #00ffff; font-weight: bold; font-size: 0.8rem;">${readableTitle}</td>
                <td>${c.comment_text}</td>
                <td style="font-size: 0.75rem; color: #666;">${new Date(c.created_at).toLocaleString()}</td>
              </tr>
            `;
          }).join('');
        }

      } catch (err) {
        console.error("Error loading admin data:", err);
      }
    }

    loadAdminData();
  </script>
</body>
</html>
