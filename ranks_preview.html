<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>BTV Abyssal Sigils Preview</title>
  <style>
    body {
      background: #050508;
      color: #e0e0e0;
      font-family: 'Cinzel', 'Trajan Pro', Georgia, serif;
      padding: 40px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 25px;
    }

    h1 {
      color: #ff0033;
      letter-spacing: 4px;
      text-transform: uppercase;
      font-size: 1.5rem;
      margin-bottom: 20px;
      text-shadow: 0 0 15px rgba(255, 0, 51, 0.4);
    }

    .sigil-card {
      width: 100%;
      max-width: 520px;
      background: radial-gradient(circle at right, #141018 0%, #0a080d 100%);
      border: 1px solid #221c2b;
      border-radius: 12px;
      padding: 16px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: relative;
      overflow: hidden;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.6);
      transition: all 0.4s ease;
    }

    .sigil-card::before {
      content: '';
      position: absolute;
      left: 0;
      top: 0;
      width: 3px;
      height: 100%;
      background: #333;
      transition: 0.3s;
    }

    .rank-text-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .rank-title {
      font-size: 1.15rem;
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    .rank-desc {
      font-size: 0.75rem;
      color: #777;
      font-family: sans-serif;
      letter-spacing: 1px;
    }

    /* أشكال الأختام SVG */
    .sigil-emblem {
      width: 56px;
      height: 56px;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .sigil-svg {
      width: 100%;
      height: 100%;
      transition: 0.4s;
    }

    /* 1. VOID INITIATE: ختم الحجر الخام الباهت */
    .tier-1::before { background: #555; }
    .tier-1 .rank-title { color: #8a8a9e; }
    .tier-1 .sigil-svg { fill: none; stroke: #4a4a5e; stroke-width: 1.5; }

    /* 2. ABYSS WANDERER: الختم الموقظ ونواة البعد */
    .tier-2::before { background: #800020; }
    .tier-2 .rank-title { color: #d1496a; }
    .tier-2 .sigil-svg {
      fill: none;
      stroke: #d1496a;
      stroke-width: 1.8;
      filter: drop-shadow(0 0 4px rgba(209, 73, 106, 0.5));
    }

    /* 3. ECHO TRANSCENDER (القدامى): رون الشفرات والعين الملعونة */
    .tier-3 {
      border-color: rgba(255, 0, 51, 0.3);
      box-shadow: 0 0 25px rgba(255, 0, 51, 0.15);
    }
    .tier-3::before { background: #ff0033; box-shadow: 0 0 10px #ff0033; }
    .tier-3 .rank-title {
      color: #ff0033;
      text-shadow: 0 0 10px rgba(255, 0, 51, 0.5);
    }
    .tier-3 .sigil-svg {
      fill: none;
      stroke: #ff0033;
      stroke-width: 2;
      filter: drop-shadow(0 0 8px rgba(255, 0, 51, 0.7));
      animation: pulse-rune 3s infinite ease-in-out;
    }

    /* 4. SHADOW REAPER: دائرة التحضير الهجومية والأنياب */
    .tier-4 {
      border-color: rgba(255, 60, 0, 0.4);
      background: radial-gradient(circle at right, #1f0c10 0%, #0a080d 100%);
    }
    .tier-4::before { background: #ff4500; box-shadow: 0 0 12px #ff4500; }
    .tier-4 .rank-title {
      color: #ff5522;
      text-shadow: 0 0 12px rgba(255, 69, 0, 0.6);
    }
    .tier-4 .sigil-svg {
      fill: none;
      stroke: #ff4500;
      stroke-width: 2;
      filter: drop-shadow(0 0 10px rgba(255, 69, 0, 0.8));
      animation: spin-slow 20s linear infinite;
    }

    /* 5. VOID ARCHITECT: خاتم العرش المطلق والتاج المشتعل */
    .tier-5 {
      border: 1px solid rgba(255, 215, 0, 0.5);
      background: radial-gradient(circle at right, #241905 0%, #0d0912 100%);
      box-shadow: 0 0 35px rgba(255, 215, 0, 0.2), inset 0 0 15px rgba(255, 0, 51, 0.2);
    }
    .tier-5::before { background: #ffd700; box-shadow: 0 0 15px #ffd700; }
    .tier-5 .rank-title {
      color: #ffd700;
      text-shadow: 0 0 15px rgba(255, 215, 0, 0.7), 0 0 5px #ff0033;
    }
    .tier-5 .sigil-svg {
      stroke: #ffd700;
      stroke-width: 2;
      filter: drop-shadow(0 0 12px rgba(255, 215, 0, 0.9));
      animation: pulse-core 2s infinite alternate ease-in-out;
    }

    @keyframes pulse-rune {
      0%, 100% { opacity: 0.8; transform: scale(0.98); }
      50% { opacity: 1; transform: scale(1.03); filter: drop-shadow(0 0 12px #ff0033); }
    }

    @keyframes spin-slow {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    @keyframes pulse-core {
      0% { transform: scale(0.95); filter: drop-shadow(0 0 8px #ffd700); }
      100% { transform: scale(1.06); filter: drop-shadow(0 0 18px #ff0033) drop-shadow(0 0 8px #ffd700); }
    }
  </style>
</head>
