<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>BTV - Soul Sigils & Particle FX Preview</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: #040306;
      color: #e2e8f0;
      font-family: 'Cinzel', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow-x: hidden;
      padding: 20px;
    }

    /* لوحة الكانفاس للرماد والنار */
    #fx-canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: none;
      z-index: 1;
    }

    .main-wrapper {
      position: relative;
      z-index: 10;
      width: 100%;
      max-width: 600px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 25px;
    }

    .portal-header {
      text-align: center;
    }

    .portal-header h1 {
      font-size: 1.6rem;
      letter-spacing: 5px;
      color: #ff0033;
      text-transform: uppercase;
      text-shadow: 0 0 20px rgba(255, 0, 51, 0.6);
      margin-bottom: 6px;
    }

    .portal-header p {
      font-size: 0.85rem;
      color: #71717a;
      letter-spacing: 2px;
      font-family: monospace;
    }

    /* كرت الرتبة الرئيسي التفاعلي */
    .sigil-stage {
      width: 100%;
      background: rgba(10, 8, 14, 0.75);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 0, 51, 0.3);
      border-radius: 16px;
      padding: 30px;
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
      box-shadow: 0 0 35px rgba(0, 0, 0, 0.9), inset 0 0 20px rgba(255, 0, 51, 0.05);
      transition: all 0.5s cubic-bezier(0.16, 1, 0.3, 1);
    }

    /* هالة الختم */
    .emblem-wrapper {
      width: 120px;
      height: 120px;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 20px;
    }

    .emblem-halo {
      position: absolute;
      width: 100%;
      height: 100%;
      border-radius: 50%;
      filter: blur(15px);
      opacity: 0.4;
      transition: all 0.5s ease;
    }

    .sigil-svg {
      width: 100%;
      height: 100%;
      z-index: 2;
      transition: all 0.5s ease;
    }

    .rank-meta {
      text-align: center;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .rank-name {
      font-size: 1.35rem;
      font-weight: 900;
      letter-spacing: 3px;
      text-transform: uppercase;
      transition: color 0.4s ease;
    }

    .rank-lore {
      font-size: 0.85rem;
      color: #a1a1aa;
      font-family: monospace;
      letter-spacing: 1px;
      min-height: 22px;
    }

    .xp-bar-container {
      width: 100%;
      height: 6px;
      background: #181824;
      border-radius: 3px;
      margin-top: 20px;
      overflow: hidden;
      border: 1px solid #27273a;
    }

    .xp-bar-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #880808, #ff0033);
      box-shadow: 0 0 10px #ff0033;
      transition: width 0.6s ease;
    }

    /* لوحة التحكم لتجربة كل رتبة */
    .control-panel {
      width: 100%;
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 8px;
    }

    .tier-btn {
      background: #0f0f17;
      border: 1px solid #242436;
      color: #94a3b8;
      padding: 10px 4px;
      font-size: 0.75rem;
      font-weight: bold;
      border-radius: 8px;
      cursor: pointer;
      font-family: monospace;
      text-align: center;
      transition: all 0.2s;
    }

    .tier-btn:hover {
      border-color: #ff0033;
      color: #fff;
    }

    .tier-btn.active {
      background: #ff0033;
      color: #fff;
      border-color: #ff0033;
      box-shadow: 0 0 12px rgba(255, 0, 51, 0.5);
    }

    /* الحركات الخاصة بالرتب */
    @keyframes heartbeat {
      0%, 100% { transform: scale(1); filter: drop-shadow(0 0 6px #ff0033); }
      50% { transform: scale(1.08); filter: drop-shadow(0 0 18px #ff0033); }
    }

    @keyframes rotate-sigil {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    @keyframes counter-rotate {
      from { transform: rotate(360deg); }
      to { transform: rotate(0deg); }
    }

    @keyframes eye-flare {
      0%, 100% { transform: scale(0.95); opacity: 0.8; }
      50% { transform: scale(1.1); opacity: 1; filter: drop-shadow(0 0 20px #ff0033); }
    }
  </style>
</head>
<body>

  <canvas id="fx-canvas"></canvas>

  <div class="main-wrapper">
    <div class="portal-header">
      <h1>BEYOND THE VOID</h1>
      <p>SOUL SIGIL INTERFACE</p>
    </div>

    <!-- كرت الهوية والختم الحي -->
    <div class="sigil-stage" id="sigil-card">
      <div class="emblem-wrapper">
        <div class="emblem-halo" id="emblem-halo"></div>
        <div id="sigil-svg-slot"></div>
      </div>

      <div class="rank-meta">
        <div class="rank-name" id="rank-title">VOID VESSEL</div>
        <div class="rank-lore" id="rank-lore">Phase 0: Fragmented Husk</div>
      </div>

      <div class="xp-bar-container">
        <div class="xp-bar-fill" id="xp-fill"></div>
      </div>
    </div>

    <!-- أزرار التبديل للمعاينة -->
    <div class="control-panel">
      <button class="tier-btn active" onclick="setTier(1)">TIER 1</button>
      <button class="tier-btn" onclick="setTier(2)">TIER 2</button>
      <button class="tier-btn" onclick="setTier(3)">TIER 3</button>
      <button class="tier-btn" onclick="setTier(4)">TIER 4</button>
      <button class="tier-btn" onclick="setTier(5)">TIER 5</button>
    </div>
  </div>

  <script>
    // 1. تعريف الأختام والمؤثرات الخاصة بكل رتبة
    var tiers = {
      1: {
        name: "VOID VESSEL",
        lore: "Phase I: The Fragmented Husk | 0 XP",
        color: "#555566",
        halo: "#333344",
        border: "rgba(85, 85, 102, 0.4)",
        xp: "10%",
        emberColor: "rgba(100, 100, 120, 0.4)",
        emberSpeed: 0.5,
        svg: `
          <svg class="sigil-svg" viewBox="0 0 100 100">
            <!-- وعاء منقسم وشرخ مظلم -->
            <circle cx="50" cy="50" r="42" fill="none" stroke="#444" stroke-width="2" stroke-dasharray="6 6"/>
            <polygon points="50,15 80,50 50,85 20,50" fill="none" stroke="#666" stroke-width="2"/>
            <path d="M50,20 L48,45 L54,55 L50,80" stroke="#888" stroke-width="2" fill="none"/>
          </svg>
        `
      },
      2: {
        name: "AWAKENED PULSE",
        lore: "Phase II: Blood Synchronization | 25 XP",
        color: "#ff2a55",
        halo: "#880022",
        border: "rgba(255, 42, 85, 0.4)",
        xp: "35%",
        emberColor: "rgba(255, 42, 85, 0.6)",
        emberSpeed: 1,
        svg: `
          <svg class="sigil-svg" viewBox="0 0 100 100" style="animation: heartbeat 1.4s infinite ease-in-out;">
            <!-- شرايين تنبض ونواة قرمزيّة -->
            <circle cx="50" cy="50" r="42" fill="none" stroke="#aa1133" stroke-width="2.5"/>
            <circle cx="50" cy="50" r="28" fill="rgba(255,0,51,0.1)" stroke="#ff2a55" stroke-width="1.5" stroke-dasharray="4 3"/>
            <polygon points="50,10 88,50 50,90 12,50" fill="none" stroke="#ff2a55" stroke-width="2"/>
            <circle cx="50" cy="50" r="10" fill="#ff0033" style="filter: drop-shadow(0 0 10px #ff0033);"/>
          </svg>
        `
      },
      3: {
        name: "CRIMSON ECLIPSE",
        lore: "Phase III: Echo Transcender (Veteran) | 60 XP",
        color: "#ff0033",
        halo: "#ff0033",
        border: "rgba(255, 0, 51, 0.6)",
        xp: "60%",
        emberColor: "rgba(255, 0, 51, 0.8)",
        emberSpeed: 1.5,
        svg: `
          <svg class="sigil-svg" viewBox="0 0 100 100">
            <!-- عين الفويد والكسوف مع دائرة رونية تدور -->
            <g style="transform-origin: 50px 50px; animation: rotate-sigil 22s linear infinite;">
              <circle cx="50" cy="50" r="44" fill="none" stroke="#ff0033" stroke-width="2" stroke-dasharray="8 5 2 5"/>
            </g>
            <path d="M15,50 Q50,18 85,50 Q50,82 15,50 Z" fill="none" stroke="#ff0033" stroke-width="2.5" style="filter: drop-shadow(0 0 8px #ff0033);"/>
            <circle cx="50" cy="50" r="14" fill="#660011" stroke="#ff0033" stroke-width="2"/>
            <circle cx="50" cy="50" r="6" fill="#ff0033" style="animation: eye-flare 2s infinite ease-in-out;"/>
            <line x1="50" y1="8" x2="50" y2="92" stroke="#ff0033" stroke-width="1.5" stroke-dasharray="3 3"/>
          </svg>
        `
      },
      4: {
        name: "ABYSSAL OVERLORD",
        lore: "Phase IV: High Vanguard Shadow | 110 XP",
        color: "#ff5500",
        halo: "#ff3300",
        border: "rgba(255, 85, 0, 0.7)",
        xp: "85%",
        emberColor: "rgba(255, 85, 0, 0.9)",
        emberSpeed: 2.2,
        svg: `
          <svg class="sigil-svg" viewBox="0 0 100 100">
            <!-- أجنحة الظل الدوارة والمصفوفة النارية المزدوجة -->
            <g style="transform-origin: 50px 50px; animation: rotate-sigil 15s linear infinite;">
              <polygon points="50,4 96,50 50,96 4,50" fill="none" stroke="#ff3300" stroke-width="2"/>
            </g>
            <g style="transform-origin: 50px 50px; animation: counter-rotate 12s linear infinite;">
              <polygon points="50,14 86,50 50,86 14,50" fill="none" stroke="#ff7700" stroke-width="1.5" stroke-dasharray="5 3"/>
            </g>
            <circle cx="50" cy="50" r="22" fill="rgba(255,60,0,0.15)" stroke="#ff4500" stroke-width="2.5"/>
            <circle cx="50" cy="50" r="9" fill="#ff3300" style="filter: drop-shadow(0 0 15px #ff5500);"/>
          </svg>
        `
      },
      5: {
        name: "EYE OF ARTHOS",
        lore: "Phase V: Sovereign of the Infinite Void | 150+ XP",
        color: "#ffd700",
        halo: "#ffd700",
        border: "rgba(255, 215, 0, 0.8)",
        xp: "100%",
        emberColor: "rgba(255, 215, 0, 0.9)",
        emberSpeed: 3,
        svg: `
          <svg class="sigil-svg" viewBox="0 0 100 100">
            <!-- بوابة أرثوس الذهبية الأزلية ونواة الفويد المشتعلة -->
            <g style="transform-origin: 50px 50px; animation: rotate-sigil 8s linear infinite;">
              <circle cx="50" cy="50" r="45" fill="none" stroke="#ffd700" stroke-width="2.5" stroke-dasharray="10 4 2 4"/>
              <polygon points="50,2 62,38 98,50 62,62 50,98 38,62 2,50 38,38" fill="none" stroke="#ffd700" stroke-width="1.5"/>
            </g>
            <g style="transform-origin: 50px 50px; animation: counter-rotate 14s linear infinite;">
              <circle cx="50" cy="50" r="32" fill="none" stroke="#ff0033" stroke-width="2" stroke-dasharray="4 4"/>
            </g>
            <circle cx="50" cy="50" r="14" fill="#ff0033" stroke="#ffd700" stroke-width="2" style="filter: drop-shadow(0 0 20px #ff0033) drop-shadow(0 0 10px #ffd700); animation: eye-flare 1s infinite alternate;"/>
          </svg>
        `
      }
    };

    var currentTier = 1;

    function setTier(t) {
      currentTier = t;
      var data = tiers[t];

      // تحديث النصوص والواجهة
      document.getElementById('rank-title').innerText = data.name;
      document.getElementById('rank-title').style.color = data.color;
      document.getElementById('rank-title').style.textShadow = '0 0 15px ' + data.color;
      
      document.getElementById('rank-lore').innerText = data.lore;
      document.getElementById('xp-fill').style.width = data.xp;
      
      // تحديث ألوان الكرت والختم
      var card = document.getElementById('sigil-card');
      card.style.borderColor = data.border;
      card.style.boxShadow = '0 0 40px ' + data.halo + '33, inset 0 0 25px ' + data.halo + '22';

      var halo = document.getElementById('emblem-halo');
      halo.style.background = data.halo;

      document.getElementById('sigil-svg-slot').innerHTML = data.svg;

      // تحديث أزرار التحكم
      var btns = document.querySelectorAll('.tier-btn');
      btns.forEach(function(b, idx) {
        if (idx + 1 === t) b.classList.add('active');
        else b.classList.remove('active');
      });
    }

    // 2. محرك جزيئات الرماد واللهب (Particle FX Canvas)
    var canvas = document.getElementById('fx-canvas');
    var ctx = canvas.getContext('2d');
    var particles = [];

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    function createParticle() {
      return {
        x: Math.random() * canvas.width,
        y: canvas.height + Math.random() * 20,
        size: Math.random() * 2.5 + 1,
        speedY: (Math.random() * 1.5 + 0.5) * tiers[currentTier].emberSpeed,
        speedX: (Math.random() - 0.5) * 1.2,
        opacity: Math.random() * 0.7 + 0.3,
        life: 0,
        maxLife: Math.random() * 150 + 100
      };
    }

    for (var i = 0; i < 60; i++) {
      particles.push(createParticle());
    }

    function animateParticles() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      for (var i = 0; i < particles.length; i++) {
        var p = particles[i];
        p.y -= p.speedY;
        p.x += p.speedX;
        p.life++;

        var currentOpacity = p.opacity * (1 - p.life / p.maxLife);

        ctx.fillStyle = tiers[currentTier].emberColor;
        ctx.shadowColor = tiers[currentTier].color;
        ctx.shadowBlur = 8;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
        ctx.fill();

        if (p.life >= p.maxLife || p.y < -10) {
          particles[i] = createParticle();
        }
      }
      requestAnimationFrame(animateParticles);
    }

    // تشغيل الرتبة الأولى والمحرك
    setTier(1);
    animateParticles();
  </script>
</body>
</html>
