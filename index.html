<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BEYOND THE VOID</title>
  <link rel="stylesheet" href="style.css">
  <style>
    /* تنسيق الفولدرات التفاعلية */
    .folder-btn {
      width: 100%;
      background: #14141f;
      color: #fff;
      border: 1px solid #28283d;
      padding: 14px 18px;
      text-align: left;
      font-size: 1rem;
      font-weight: bold;
      border-radius: 8px;
      cursor: pointer;
      margin-top: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      transition: 0.3s;
    }
    .folder-btn:hover {
      border-color: var(--crimson-glow, #ff0033);
      box-shadow: 0 0 10px rgba(255, 30, 66, 0.2);
    }
    .folder-content {
      display: none;
      background: #0d0d14;
      border: 1px solid #1f1f2e;
      border-top: none;
      border-radius: 0 0 8px 8px;
      padding: 10px;
    }
    .folder-item {
      padding: 10px;
      border-bottom: 1px solid #1a1a26;
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: pointer;
      color: var(--text-main, #e2e8f0);
      text-decoration: none;
    }
    .folder-item:hover {
      color: var(--crimson-glow, #ff0033);
      background: #141420;
    }
    .folder-item:last-child { border-bottom: none; }

    /* النقطة الحمراء النابضة للجديد */
    .new-dot {
      display: inline-block;
      width: 8px;
      height: 8px;
      background-color: #ff0033;
      border-radius: 50%;
      margin-left: 8px;
      box-shadow: 0 0 8px #ff0033;
      animation: pulse-dot 1.5s infinite;
      vertical-align: middle;
    }

    @keyframes pulse-dot {
      0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(255, 0, 51, 0.7); }
      70% { transform: scale(1.2); box-shadow: 0 0 0 6px rgba(255, 0, 51, 0); }
      100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(255, 0, 51, 0); }
    }
  </style>
</head>
<body>

  <header>
    <div class="logo-container">
      <img src="logo.png" alt="BTV Logo">
    </div>
    <h1 id="site-title">BEYOND THE VOID</h1>
    <p class="tagline" id="site-tagline">Dark Fantasy Universe</p>
  </header>

  <div class="section-title">🎬 Video Cinema (9:16)</div>
  <div class="cinema-wrapper">
    <div class="video-frame-container" id="video-container"></div>
  </div>

  <div class="section-title">📁 Animation Episodes (Seasons)</div>
  <div style="width: 100%; max-width: 800px; margin: 0 auto;" id="seasons-container"></div>

  <div class="section-title">📖 Webtoon Story (Arcs & Parts)</div>
  <div style="width: 100%; max-width: 800px; margin: 0 auto;" id="webtoon-container"></div>

  <div class="audio-section" style="margin: 40px auto; max-width: 800px; text-align: center; padding: 0 15px;">
    
    <div style="margin-bottom: 30px; background: rgba(20, 20, 31, 0.6); border: 1px solid rgba(255, 0, 51, 0.4); border-radius: 12px; padding: 16px; box-shadow: 0 0 15px rgba(255, 0, 51, 0.15);">
      <div style="display: flex; align-items: center; justify-content: center; gap: 8px; margin-bottom: 12px;">
        <span class="new-dot" style="margin-left: 0;"></span>
        <span style="color: #ff0033; font-family: sans-serif; font-weight: bold; font-size: 13px; letter-spacing: 2px; text-transform: uppercase;">
          LATEST OST RELEASE
        </span>
      </div>
      <iframe 
        src="https://audiomack.com/embed/xmrboymanx/song/the-asylum" 
        scrolling="no" 
        width="100%" 
        height="252" 
        frameborder="0" 
        title="The asylum"
        style="border-radius: 8px; border: 1px solid #28283d;">
      </iframe>
    </div>

    <h2 style="color: #ff0033; font-family: sans-serif; text-transform: uppercase; letter-spacing: 2px; margin-bottom: 5px;">
      🎵 Official Soundtrack (OST)
    </h2>
    <p style="color: #888; font-size: 14px; margin-bottom: 20px;">Complete Original Series Playlist</p>
    <iframe 
      src="https://audiomack.com/embed/playlist/xmrboymanx/beyond-the-void-ost?background=1" 
      scrolling="no" 
      width="100%" 
      height="450" 
      frameborder="0" 
      title="Beyond The Void OST"
      style="border-radius: 12px; box-shadow: 0 0 20px rgba(255, 0, 51, 0.2); border: 1px solid rgba(255, 0, 51, 0.3);">
    </iframe>
  </div>

      var vc = document.getElementById('video-container');

        window.scrollTo({ top: 180, behavior: 'smooth' });
      }
    }
