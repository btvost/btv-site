<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BEYOND THE VOID</title>
  <link rel="stylesheet" href="style.css">
  <style>
    /* محرك الجزيئات الخلفي والمؤثرات */
    #fx-canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: none;
      z-index: 0;
    }

    /* كانفاس رذاذ احتكاك الفولدرات الرملي */
    #burst-canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: none;
      z-index: 99999;
    }

    body {
      position: relative;
      z-index: 1;
    }

    /* نافذة التسجيل الأولى للمستخدم */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.9);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 9999;
    }
    .modal-card {
      background: #0d0d14;
      border: 1px solid #ff0033;
      border-radius: 12px;
      padding: 30px 25px;
      width: 90%;
      max-width: 420px;
      text-align: center;
      box-shadow: 0 0 30px rgba(255, 0, 51, 0.35);
      box-sizing: border-box;
    }
    .modal-card h2 {
      color: #fff;
      font-size: 1.4rem;
      margin-top: 0;
      margin-bottom: 8px;
      letter-spacing: 2px;
    }
    .modal-card p {
      color: #888;
      font-size: 0.85rem;
      margin-bottom: 20px;
    }
    .modal-input-group {
      margin-bottom: 15px;
      text-align: left;
    }
    .modal-input-group label {
      display: block;
      color: #aaa;
      font-size: 0.8rem;
      margin-bottom: 5px;
      font-family: monospace;
    }
    .modal-input-group input, .modal-input-group select {
      width: 100%;
      padding: 10px 12px;
      background: #14141f;
      border: 1px solid #28283d;
      border-radius: 6px;
      color: #fff;
      font-size: 0.95rem;
      box-sizing: border-box;
      outline: none;
    }
    .modal-input-group input:focus, .modal-input-group select:focus {
      border-color: #ff0033;
    }
    .modal-btn {
      width: 100%;
      background: #ff0033;
      color: #fff;
      border: none;
      padding: 12px;
      font-weight: bold;
      font-size: 1rem;
      border-radius: 6px;
      cursor: pointer;
      margin-top: 10px;
      letter-spacing: 1px;
      transition: 0.2s;
    }
    .modal-btn:hover {
      background: #cc0029;
      box-shadow: 0 0 15px rgba(255, 0, 51, 0.5);
    }

    /* شريط الهوية والختم الحي في الهيدر */
    .id-strip-container {
      width: 100%;
      max-width: 800px;
      margin: 15px auto;
      background: rgba(13, 13, 20, 0.85);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 0, 51, 0.4);
      border-radius: 12px;
      padding: 12px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 0 20px rgba(0, 0, 0, 0.8);
      box-sizing: border-box;
      transition: all 0.4s ease;
    }
    .id-strip-left {
      display: flex;
      align-items: center;
      gap: 15px;
    }
    .id-sigil-icon {
      width: 48px;
      height: 48px;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .id-strip-info {
      display: flex;
      flex-direction: column;
      gap: 3px;
    }
    .id-strip-alias {
      font-size: 1.05rem;
      font-weight: bold;
      color: #fff;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .id-strip-rank {
      font-size: 0.85rem;
      font-weight: bold;
      font-family: monospace;
      letter-spacing: 1.5px;
      text-transform: uppercase;
    }
    .id-strip-meta {
      font-size: 0.75rem;
      color: #777;
      font-family: monospace;
      text-align: right;
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 3px;
    }

    .reset-btn {
      background: transparent;
      border: 1px solid #333;
      color: #666;
      font-size: 0.65rem;
      padding: 2px 6px;
      border-radius: 4px;
      cursor: pointer;
      margin-top: 4px;
      transition: 0.2s;
    }
    .reset-btn:hover {
      border-color: #ff0033;
      color: #ff0033;
    }

    /* عناوين الأقسام الرئيسية المطورة */
    .section-header-custom {
      display: flex;
      align-items: center;
      gap: 10px;
      width: 100%;
      max-width: 800px;
      margin: 30px auto 10px auto;
      padding: 0 5px;
      box-sizing: border-box;
    }
    .section-header-icon {
      width: 22px;
      height: 22px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .section-header-icon svg {
      width: 100%;
      height: 100%;
      stroke: #ff0033;
      fill: none;
      filter: drop-shadow(0 0 5px rgba(255, 0, 51, 0.5));
    }
    .section-header-text {
      color: #ff0033;
      font-size: 0.95rem;
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
      font-family: sans-serif;
      text-shadow: 0 0 10px rgba(255, 0, 51, 0.4);
    }

    /* حركات الأختام */
    @keyframes heartbeat {
      0%, 100% { transform: scale(1); filter: drop-shadow(0 0 4px #ff0033); }
      50% { transform: scale(1.08); filter: drop-shadow(0 0 12px #ff0033); }
    }
    @keyframes rotate-sigil {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    @keyframes counter-rotate {
      from { transform: rotate(360deg); }
      to { transform: rotate(0deg); }
    }
    @keyframes eye-flare {
      0%, 100% { transform: scale(0.95); opacity: 0.8; }
      50% { transform: scale(1.1); opacity: 1; filter: drop-shadow(0 0 15px #ff0033); }
    }

    /* كروت الفولدرات الرومانية المخصصة */
    .btv-folder-card {
      width: 100%;
      background: #0d0c14;
      border: 1px solid #1f1d2b;
      border-radius: 10px;
      overflow: hidden;
      margin-top: 12px;
      transition: border-color 0.3s ease, box-shadow 0.3s ease;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.7);
    }
    .btv-folder-card:hover {
      border-color: rgba(255, 0, 51, 0.45);
      box-shadow: 0 0 15px rgba(255, 0, 51, 0.15);
    }

    .btv-folder-header {
      width: 100%;
      background: transparent;
      border: none;
      padding: 14px 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      cursor: pointer;
      color: #fff;
      text-align: left;
    }

    .folder-title-left {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .portal-sigil-icon {
      width: 38px;
      height: 38px;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .portal-sigil-svg {
      width: 100%;
      height: 100%;
      stroke: #ff0033;
      fill: none;
      stroke-width: 2;
      transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1), filter 0.3s ease;
    }
    .core-spark-point {
      fill: #ff0033;
      transition: all 0.3s ease;
    }

    .folder-title-text {
      font-size: 1rem;
      font-weight: 700;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: #f1f5f9;
      display: flex;
      align-items: center;
    }

    .folder-chevron {
      font-size: 0.85rem;
      color: #64748b;
      font-family: monospace;
      transition: transform 0.3s ease, color 0.3s ease;
    }

    .btv-folder-card.open {
      border-color: #ff0033;
      box-shadow: 0 0 20px rgba(255, 0, 51, 0.25);
    }
    .btv-folder-card.open .portal-sigil-svg {
      transform: scale(1.08);
      filter: drop-shadow(0 0 8px #ff0033);
    }
    .btv-folder-card.open .core-spark-point {
      filter: drop-shadow(0 0 10px #ff0033);
    }
    .btv-folder-card.open .folder-chevron {
      transform: rotate(180deg);
      color: #ff0033;
    }

    .folder-content {
      display: none;
      background: #08070d;
      border-top: 1px solid #161520;
      padding: 8px 12px;
    }

    .folder-item {
      padding: 11px 14px;
      border-bottom: 1px solid #14131f;
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: pointer;
      color: #cbd5e1;
      text-decoration: none;
      font-size: 0.9rem;
      border-radius: 6px;
      transition: all 0.2s ease;
    }
    .folder-item:hover {
      color: #ff0033;
      background: #100f1c;
      padding-left: 18px;
    }
    .folder-item:last-child { border-bottom: none; }

    /* النقطة الحمراء النابضة للجديد */
    .new-dot {
      display: inline-block;
      width: 8px;
      height: 8px;
      background-color: #ff0033;
      border-radius: 50%;
      margin-left: 8px;
      box-shadow: 0 0 8px #ff0033;
      animation: pulse-dot 1.5s infinite;
      vertical-align: middle;
    }
    @keyframes pulse-dot {
      0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(255, 0, 51, 0.7); }
      70% { transform: scale(1.2); box-shadow: 0 0 0 6px rgba(255, 0, 51, 0); }
      100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(255, 0, 51, 0); }
    }
  </style>
</head>
<body>

  <canvas id="fx-canvas"></canvas>
  <canvas id="burst-canvas"></canvas>

  <!-- نافذة التسجيل الأولى -->
  <div class="modal-overlay" id="registration-modal" style="display: none;">
    <div class="modal-card">
      <h2>ENTER THE VOID</h2>
      <p>Initialize your soul signature to bind with the archives.</p>
      
      <div class="modal-input-group">

      </div>

      <div class="modal-input-group">
        <label>GENDER</label>
        <select id="reg-gender">
          <option value="Male">Male</option>
          <option value="Female">Female</option>
        </select>
      </div>

      <div class="modal-input-group">
        <label>AUTHORITY / PASSCODE (OPTIONAL)</label>
        <input type="text" id="reg-passcode" placeholder="Enter secret code if granted...">
      </div>

      <button class="modal-btn" onclick="saveUserIdentity()">SYNCHRONIZE IDENTITY</button>
    </div>
  </div>

  <header>
    <div class="logo-container">
      <img src="logo.png" alt="BTV Logo">
    </div>
    <h1 id="site-title">BEYOND THE VOID</h1>
    <p class="tagline" id="site-tagline">Dark Fantasy Universe</p>
  </header>

  <!-- شريط الرتبة والختم الحي في أعلى الموقع -->

    </div>
    <div class="id-strip-meta">

      <div id="strip-xp-text" style="color: #ff0033; font-weight: bold;">0 XP</div>
      <button class="reset-btn" onclick="resetUserIdentity()">[ RESET ID ]</button>

  <!-- عنوان سكشن السينما -->

      </svg>
    </div>
    <div class="section-header-text">VIDEO CINEMA (9:16)</div>
  </div>

  <div class="cinema-wrapper">
    <div class="video-frame-container" id="video-container"></div>
  </div>

  <!-- عنوان سكشن الأنيميشن المطور -->

          <g style="transform-origin: 50px 50px; animation: rotate-sigil 5s linear infinite;">
            <circle cx="50" cy="50" r="46" fill="none" stroke="#b026ff" stroke-width="3" stroke-dasharray="12 4 4 4"/>
            <polygon points="50,0 64,36 100,50 64,64 50,100 36,64 0,50 36,36" fill="none" stroke="#ffd700" stroke-width="2"/>
          </g>
          <g style="transform-origin: 50px 50px; animation: counter-rotate 9s linear infinite;">
            <polygon points="50,12 88,50 50,88 12,50" fill="none" stroke="#ff0033" stroke-width="2" stroke-dasharray="6 3"/>
          </g>
          <circle cx="50" cy="50" r="16" fill="#1b002c" stroke="#ffd700" stroke-width="2.5"/>
          <circle cx="50" cy="8" r="8" fill="#b026ff" style="filter: drop-shadow(0 0 25px #b026ff) drop-shadow(0 0 12px #ffd700); animation: eye-flare 0.8s infinite alternate;"/>
        </svg>`
      }
    };

    var currentTier = 1;

    function getStorage(key, def) {
      try {
        var v = localStorage.getItem(key);
        return v ? JSON.parse(v) : def;
      } catch (e) { return def; }
    }

    function setStorage(key, val) {
      try { localStorage.setItem(key, JSON.stringify(val)); } catch (e) {}
    }

    function calculateTier(user) {
      if (user.isCreator) return "creator";
      if (user.isVeteran) return 3;
      var xp = user.xp || 0;
      if (xp >= 150) return 5;
      if (xp >= 100) return 4;
      if (xp >= 50) return 3;
      if (xp >= 20) return 2;
      return 1;
    }

    function checkUserIdentity() {
      var user = getStorage('btv_user', null);
      if (!user) {
        document.getElementById('registration-modal').style.display = 'flex';
      } else {
        renderUserStrip(user);
      }
    }

    function resetUserIdentity() {
      try { localStorage.removeItem('btv_user'); } catch (e) {}
      location.reload();
    }

    function saveUserIdentity() {
      var aliasInput = document.getElementById('reg-alias').value.trim();
      var genderInput = document.getElementById('reg-gender').value;
      var passcodeInput = document.getElementById('reg-passcode').value.trim();

      var isCreator = (passcodeInput === CREATOR_SECRET_CODE || aliasInput === CREATOR_SECRET_CODE);
      var isVeteran = (passcodeInput === VETERAN_SECRET_CODE || aliasInput === VETERAN_SECRET_CODE);

      var finalAlias = aliasInput;
      if (isCreator) {
        finalAlias = "MR.B";
      } else if (isVeteran && (aliasInput === VETERAN_SECRET_CODE || !aliasInput)) {
        finalAlias = "Void Veteran";
      }

      if (!finalAlias) {
        alert("Please enter a codename / alias.");
        return;
      }

      var expId = isCreator ? 'AUTHORITY-000' : ('BTV-' + Math.floor(1000 + Math.random() * 9000));
      var initialXp = isCreator ? 9999 : (isVeteran ? 60 : 0);

      var user = {
        alias: finalAlias,
        gender: genderInput,
        isCreator: isCreator,
        isVeteran: isVeteran,
        expId: expId,
        xp: initialXp,
        readItems: (isCreator || isVeteran) ? ['all_authorized'] : []
      };

      setStorage('btv_user', user);
      document.getElementById('registration-modal').style.display = 'none';
      renderUserStrip(user);
      if (globalData) renderContent(globalData);
    }

    function renderUserStrip(user) {
      var strip = document.getElementById('user-strip');
      if (!strip) return;
      strip.style.display = 'flex';

      var tierKey = calculateTier(user);
      currentTier = tierKey;
      var tData = sigilTiers[tierKey];

      document.getElementById('strip-alias-text').innerText = user.alias;
      document.getElementById('strip-gender-badge').innerText = user.isCreator ? 'CREATOR' : user.gender;
      document.getElementById('strip-code').innerText = user.expId;
      
      var rankEl = document.getElementById('strip-rank-text');
      rankEl.innerText = tData.name;
      rankEl.style.color = tData.color;
      rankEl.style.textShadow = '0 0 12px ' + tData.color;

      document.getElementById('strip-xp-text').innerText = (user.xp || 0) + ' XP';
      document.getElementById('strip-xp-text').style.color = tData.color;

      strip.style.borderColor = tData.border;
      strip.style.boxShadow = '0 0 30px ' + tData.halo;

      document.getElementById('strip-sigil-slot').innerHTML = tData.svg;
    }

    function markAsRead(itemId, xpPoints) {
      var user = getStorage('btv_user', null);
      if (!user) return;
      if (!user.readItems) user.readItems = [];
      if (!user.readItems.includes(itemId)) {
        user.readItems.push(itemId);
        user.xp = (user.xp || 0) + (xpPoints || 5);
        setStorage('btv_user', user);
        renderUserStrip(user);
      }
      var dot = document.getElementById('dot-' + itemId);
      if (dot) dot.style.display = 'none';
    }

    function changeVideo(youtubeId, itemId) {
      if (itemId) markAsRead(itemId, 10);
      var vc = document.getElementById('video-container');
      if (vc) {
        vc.innerHTML = '<iframe src="https://www.youtube.com/embed/' + youtubeId + '?autoplay=1&rel=0&modestbranding=1" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>';
        window.scrollTo({ top: 220, behavior: 'smooth' });
      }
    }

    // محرك رذاذ الاحتكاك الرملي
    var burstCanvas = document.getElementById('burst-canvas');
    var bCtx = burstCanvas.getContext('2d');
    var burstParticles = [];
    var isBurstActive = false;

    function resizeBurstCanvas() {
      burstCanvas.width = window.innerWidth;
      burstCanvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeBurstCanvas);
    resizeBurstCanvas();

    function triggerStoneFrictionBurst(x, y) {
      var colors = ['#ff0033', '#e11d48', '#ff3344', '#ff7700', '#ffd700'];
      for (var i = 0; i < 28; i++) {
        var angle = Math.random() * Math.PI * 2;
        var speed = Math.random() * 4.2 + 1.2;
        burstParticles.push({
          x: x,
          y: y,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed - 0.4,
          size: Math.random() * 2 + 0.8,
          color: colors[Math.floor(Math.random() * colors.length)],
          alpha: 1,
          decay: Math.random() * 0.035 + 0.02
        });
      }
      if (!isBurstActive) {
        isBurstActive = true;
        animateBurst();
      }
    }

    function animateBurst() {
      bCtx.clearRect(0, 0, burstCanvas.width, burstCanvas.height);
      for (var i = burstParticles.length - 1; i >= 0; i--) {
        var p = burstParticles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.alpha -= p.decay;

        if (p.alpha <= 0) {
          burstParticles.splice(i, 1);
          continue;
        }

        bCtx.save();
        bCtx.globalAlpha = p.alpha;
        bCtx.fillStyle = p.color;
        bCtx.shadowColor = p.color;
        bCtx.shadowBlur = 4;
        bCtx.beginPath();
        bCtx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
        bCtx.fill();
        bCtx.restore();
      }

      if (burstParticles.length > 0) {
        requestAnimationFrame(animateBurst);
      } else {
        isBurstActive = false;
      }
    }

    function toggleBtvFolder(cardId, contentId, event) {
      var card = document.getElementById(cardId);
      var content = document.getElementById(contentId);
      var isOpen = card.classList.contains('open');

      var sparkPoint = card.querySelector('.core-spark-point');
      if (sparkPoint) {
        var rect = sparkPoint.getBoundingClientRect();
        triggerStoneFrictionBurst(rect.left + rect.width / 2, rect.top + rect.height / 2);
      }

      if (isOpen) {
        card.classList.remove('open');
        content.style.display = 'none';
      } else {
        card.classList.add('open');
        content.style.display = 'block';
      }
    }

    function renderContent(data) {
      var user = getStorage('btv_user', { readItems: [] });
      var isAuthorized = user && (user.isCreator || user.isVeteran);

      // بناء مواسم الأنيميشن
      var seasonsContainer = document.getElementById('seasons-container');
      seasonsContainer.innerHTML = '';
      if (data.seasons) {
        var activeSeasonIdx = -1;
        for (var i = data.seasons.length - 1; i >= 0; i--) {
          if (data.seasons[i].episodes && data.seasons[i].episodes.length > 0) {
            activeSeasonIdx = i;
            break;
          }
        }

        data.seasons.forEach(function(s, idx) {
          var epsHtml = '';
          var isLatestSeason = (idx === activeSeasonIdx);

          if (s.episodes && s.episodes.length > 0) {
            var lastEpIdx = s.episodes.length - 1;

            epsHtml = s.episodes.map(function(ep, epIdx) {
              var isLatestEp = (isLatestSeason && epIdx === lastEpIdx);
              var epId = 'ep_' + ep.youtube_id;
              var isRead = isAuthorized || (user.readItems && user.readItems.includes(epId));
              var showDot = isLatestEp && !isRead;

              var dotHtml = showDot ? '<span class="new-dot" id="dot-' + epId + '"></span>' : '';
              return '<div class="folder-item" onclick="changeVideo(\'' + ep.youtube_id + '\', \'' + epId + '\')">' +
                '<span>▶ ' + ep.title + ' ' + dotHtml + '</span>' +
                '<span style="font-size: 0.8rem; color: #888;">' + ep.duration + ' ↗</span>' +
                '</div>';
            }).join('');
          }

          var seasonDotHtml = isLatestSeason ? '<span class="new-dot"></span>' : '';
          seasonsContainer.innerHTML += `
            <div class="btv-folder-card" id="season-card-${idx}">
              <button class="btv-folder-header" onclick="toggleBtvFolder('season-card-${idx}', 'season-content-${idx}', event)">
                <div class="folder-title-left">
                  <div class="portal-sigil-icon">${ARTHOS_GATEWAY_SVG}</div>
                  <div class="folder-title-text">${s.season_title} ${seasonDotHtml}</div>
                </div>
                <div class="folder-chevron">▼</div>
              </button>
              <div class="folder-content" id="season-content-${idx}">${epsHtml}</div>
            </div>
          `;
        });
      }

      // بناء فصول الويبتون
      var webtoonContainer = document.getElementById('webtoon-container');
      webtoonContainer.innerHTML = '';
      if (data.webtoon_arcs) {
        var lastArcIdx = data.webtoon_arcs.length - 1;

        data.webtoon_arcs.forEach(function(arc, idx) {
          var isLatestArc = (idx === lastArcIdx);
          var chsHtml = '';

          if (arc.chapters) {
            var lastChapterIdx = arc.chapters.length - 1;
            chsHtml = arc.chapters.map(function(ch, chIdx) {
              var isLatestChapter = isLatestArc && (chIdx === lastChapterIdx);
              var chId = 'ch_' + idx + '_' + chIdx;
              var isRead = isAuthorized || (user.readItems && user.readItems.includes(chId));
              var showDot = isLatestChapter && !isRead;

              var dotHtml = showDot ? '<span class="new-dot" id="dot-' + chId + '"></span>' : '';
              return '<a href="' + ch.url + '" target="_blank" class="folder-item" onclick="markAsRead(\'' + chId + '\', 5)">' +
                '<span>📖 ' + ch.chapter_num + ': ' + ch.title + ' ' + dotHtml + '</span>' +
                '<span style="font-size: 0.8rem; color: var(--crimson-glow, #ff0033);">Read ↗</span>' +
                '</a>';
            }).join('');
          }

          var arcDotHtml = isLatestArc ? '<span class="new-dot"></span>' : '';
          webtoonContainer.innerHTML += `
            <div class="btv-folder-card" id="arc-card-${idx}">
              <button class="btv-folder-header" onclick="toggleBtvFolder('arc-card-${idx}', 'arc-content-${idx}', event)">
                <div class="folder-title-left">
                  <div class="portal-sigil-icon">${ARTHOS_GATEWAY_SVG}</div>
                  <div class="folder-title-text">${arc.arc_title} ${arcDotHtml}</div>
                </div>
                <div class="folder-chevron">▼</div>
              </button>
              <div class="folder-content" id="arc-content-${idx}">${chsHtml}</div>
            </div>
          `;
        });
      }
    }

    // محرك الكانفاس لجزيئات الرماد الخلفية
    var canvas = document.getElementById('fx-canvas');
    var ctx = canvas.getContext('2d');
    var particles = [];

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    function createParticle() {
      var t = sigilTiers[currentTier] || sigilTiers[1];
      return {
        x: Math.random() * canvas.width,
        y: canvas.height + Math.random() * 20,
        size: Math.random() * 2 + 0.8,
        speedY: (Math.random() * 1.2 + 0.4) * t.emberSpeed,
        speedX: (Math.random() - 0.5) * 0.8,
        opacity: Math.random() * 0.6 + 0.2,
        life: 0,
        maxLife: Math.random() * 140 + 80
      };
    }

    for (var i = 0; i < 45; i++) {
      particles.push(createParticle());
    }

    function animateParticles() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      var t = sigilTiers[currentTier] || sigilTiers[1];

      for (var i = 0; i < particles.length; i++) {
        var p = particles[i];
        p.y -= p.speedY;
        p.x += p.speedX;
        p.life++;

        ctx.fillStyle = t.emberColor;
        ctx.shadowColor = t.color;
        ctx.shadowBlur = 6;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
        ctx.fill();

        if (p.life >= p.maxLife || p.y < -10) {
          particles[i] = createParticle();
        }
      }
      requestAnimationFrame(animateParticles);
    }

    // جلب البيانات وبدء الموقع
    fetch('data.json?v=' + Date.now())
      .then(function(res) { return res.json(); })
      .then(function(data) {
        globalData = data;
        if (data.project) document.getElementById('site-title').innerText = data.project;
        if (data.tagline) document.getElementById('site-tagline').innerText = data.tagline;

        if (data.seasons && data.seasons[0] && data.seasons[0].episodes && data.seasons[0].episodes[0]) {
          changeVideo(data.seasons[0].episodes[0].youtube_id, null);
        }

        checkUserIdentity();
        renderContent(data);
        animateParticles();
      })
      .catch(function(err) {
        console.error("Error loading data:", err);
      });
  </script>
</body>
</html>
