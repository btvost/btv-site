<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>BTV - The Arthos Gateway & Central Blood-Sand Burst</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: #050408;
      color: #e2e8f0;
      font-family: 'Cinzel', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    /* لوحة الكانفاس للرذاذ الرملي المؤقت */
    #burst-canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: none;
      z-index: 9999;
    }

    .container {
      width: 100%;
      max-width: 600px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .btv-folder-card {
      background: #0d0c14;
      border: 1px solid #1f1d2b;
      border-radius: 10px;
      overflow: hidden;
      transition: all 0.3s ease;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.7);
    }

    .btv-folder-card:hover {
      border-color: rgba(255, 0, 51, 0.4);
      box-shadow: 0 0 15px rgba(255, 0, 51, 0.15);
    }

    .btv-folder-header {
      width: 100%;
      background: transparent;
      border: none;
      padding: 16px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      cursor: pointer;
      color: #fff;
      text-align: left;
    }

    .folder-title-group {
      display: flex;
      align-items: center;
      gap: 15px;
    }

    .folder-name {
      font-size: 1.05rem;
      font-weight: 700;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: #f1f5f9;
    }

    .folder-tag {
      font-size: 0.75rem;
      color: #ff0033;
      font-family: monospace;
      display: block;
      margin-top: 2px;
    }

    /* ختم بوابة أرثوس */
    .sigil-icon-slot {
      width: 44px;
      height: 44px;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .sigil-svg {
      width: 100%;
      height: 100%;
      stroke: #ff0033;
      fill: none;
      stroke-width: 2;
      transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    }

    /* النواة المركزية في قلب البوابة */
    .core-eye {
      fill: #ff0033;
      stroke: none;
      transition: all 0.3s ease;
      transform-origin: 32px 32px;
    }

    /* سهم التوسيع */
    .expand-chevron {
      font-size: 0.85rem;
      color: #64748b;
      font-family: monospace;
      transition: transform 0.3s ease, color 0.3s ease;
    }

    /* حالة الفتح */
    .btv-folder-card.open {
      border-color: #ff0033;
      box-shadow: 0 0 25px rgba(255, 0, 51, 0.25);
    }

    .btv-folder-card.open .sigil-svg {
      filter: drop-shadow(0 0 8px #ff0033);
      transform: scale(1.08);
    }

    .btv-folder-card.open .core-eye {
      filter: drop-shadow(0 0 12px #ff0033);
      animation: pulse-eye 1.5s infinite alternate;
    }

    .btv-folder-card.open .expand-chevron {
      transform: rotate(180deg);
      color: #ff0033;
    }

    .btv-folder-body {
      display: none;
      padding: 16px 20px;
      background: #08070d;
      border-top: 1px solid #161520;
      font-size: 0.85rem;
      color: #94a3b8;
      font-family: monospace;
      line-height: 1.6;
    }

    @keyframes pulse-eye {
      0% { transform: scale(0.9); opacity: 0.8; }
      100% { transform: scale(1.35); opacity: 1; filter: drop-shadow(0 0 14px #ff0033); }
    }
  </style>
</head>
<body>

  <canvas id="burst-canvas"></canvas>

  <div class="container">
    <div class="btv-folder-card" id="season-card">
      <button class="btv-folder-header" onclick="toggleFolderWithBurst('season-card', event)">
        <div class="folder-title-group">
          <div class="sigil-icon-slot">
            <svg class="sigil-svg" viewBox="0 0 64 64">
              <!-- القوس الروماني والأعمدة موزونة هندسياً حول المركز (32, 32) -->
              <path d="M14,54 L14,28 A18,18 0 0,1 50,28 L50,54" />
              <line x1="10" y1="54" x2="54" y2="54" stroke-width="2.5" />
              <!-- تاج البوابة ورأس الحربة العلوي -->
              <polygon points="32,6 44,18 20,18" />
              <!-- حزام وسطي للبوابة -->
              <line x1="14" y1="28" x2="50" y2="28" stroke-dasharray="2 3" stroke-width="1.2" />
              
              <!-- النواة في قلب ومركز البوابة تماماً (cx=32, cy=32) -->
              <circle cx="32" cy="32" r="5" class="core-eye" id="eye-emitter" />
            </svg>
          </div>
          <div>
            <div class="folder-name">SEASON 1: GENESIS</div>
            <span class="folder-tag">ARCHIVE ACTIVE • 6 EPISODES</span>
          </div>
        </div>
        <div class="expand-chevron">▼</div>
      </button>

      <div class="btv-folder-body" id="season-body">
        [ EPISODES ARCHIVE CONTAINER ]<br>
        هنا بتترتب الحلقات، وتحتها تفريعة الأوستات بنفس الختم الروماني المركزي!
      </div>
    </div>
  </div>

  <script>
    var canvas = document.getElementById('burst-canvas');
    var ctx = canvas.getContext('2d');
    var particles = [];
    var isBurstActive = false;

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    function triggerSandBurst(x, y) {
      var sandColors = ['#ff0033', '#e11d48', '#ff3344', '#ff7700', '#ffd700'];
      
      // توليد رذاذ رملي دائري ينفجر من المركز بالتساوي
      for (var i = 0; i < 30; i++) {
        var angle = Math.random() * Math.PI * 2;
        var speed = Math.random() * 4.5 + 1.2;
        particles.push({
          x: x,
          y: y,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed,
          size: Math.random() * 2.2 + 0.8,
          color: sandColors[Math.floor(Math.random() * sandColors.length)],
          alpha: 1,
          decay: Math.random() * 0.035 + 0.02
        });
      }

      if (!isBurstActive) {
        isBurstActive = true;
        animateBurst();
      }
    }

    function animateBurst() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      for (var i = particles.length - 1; i >= 0; i--) {
        var p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.alpha -= p.decay;

        if (p.alpha <= 0) {
          particles.splice(i, 1);
          continue;
        }

        ctx.save();
        ctx.globalAlpha = p.alpha;
        ctx.fillStyle = p.color;
        ctx.shadowColor = p.color;
        ctx.shadowBlur = 4;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }

      if (particles.length > 0) {
        requestAnimationFrame(animateBurst);
      } else {
        isBurstActive = false;
      }
    }

    function toggleFolderWithBurst(cardId, event) {
      var card = document.getElementById(cardId);
      var body = document.getElementById('season-body');
      var isOpen = card.classList.contains('open');

      // حساب مركز النواة بدقة تامة لإطلاق الرذاذ من وسط البوابة
      var eye = card.querySelector('.core-eye');
      var rect = eye.getBoundingClientRect();
      var originX = rect.left + rect.width / 2;
      var originY = rect.top + rect.height / 2;

      triggerSandBurst(originX, originY);

      if (isOpen) {
        card.classList.remove('open');
        body.style.display = 'none';
      } else {
        card.classList.add('open');
        body.style.display = 'block';
      }
    }
  </script>
</body>
</html>
